# fuzznet CI.
#
# TWO JOBS BECAUSE THERE ARE TWO BUILDS, and the second checks something a
# desktop structurally cannot. `git archive` and a submodule-less checkout
# carry no submodule contents, so the `core` job builds the library with no
# crypto binding at all -- the arrangement an embedded target actually uses,
# and one nobody exercises by hand because a developer's tree always has the
# submodule.
#
# MONOCYPHER_DIR MUST BE SET EXPLICITLY FOR THAT, and this was measured
# rather than assumed. An un-checked-out submodule leaves `monocypher/`
# present and EMPTY, and the Makefile refuses that by name -- it does not
# fall back to building without the bindings, deliberately, because silently
# building something other than what was asked for is worse. So `core` passes
# `MONOCYPHER_DIR=` and gets the loud skip; a job that merely omitted the
# submodule would fail on the first target.
#
# `make schema` is absent from both jobs on purpose: it needs SITU_DIR
# pointing at a situ checkout, and a second repository is a cost this
# workflow does not pay to duplicate a gate that runs locally.
name: ci

on:
  push:
  pull_request:

jobs:
  core:
    name: core (no crypto binding)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Deliberately without submodules: this job is the no-binding build.
      - name: build and test
        run: make test MONOCYPHER_DIR=
      - name: style gate
        run: make style MONOCYPHER_DIR=
      # `installcheck` RUNS HERE NOW, and this job is the only thing that
      # ever asks it the question. `make installcheck MONOCYPHER_DIR=` used
      # to fail outright: tool/consumer_check.c includes the four binding
      # headers unconditionally and argues why, while `install` shipped them
      # only when the bindings were built, so both arms that compile against
      # installed headers looked for files that were not there. HDRS gains
      # MONO_HDRS outside the conditional now -- see the Makefile, which has
      # the reasoning -- and all three arms build and run with no Monocypher
      # anywhere.
      #
      # Keeping it is the point rather than a tidy-up. The `full` job below
      # runs `installcheck` too, but its first arm is the only no-binding
      # thing in it; this job reaches the other two, which is the
      # arrangement an embedded consumer actually has and one nobody
      # exercises by hand.
      - name: consumer arrangements
        run: make installcheck MONOCYPHER_DIR=

  full:
    name: full (vendored Monocypher)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: build and test
        run: make test
      - name: style gate
        run: make style
      - name: consumer arrangements
        run: make installcheck
      - name: sanitizers
        run: make SANITIZE=1 BUILD_DIR=san test
      # Reduced from the default 200000 cases. The harnesses are what this
      # proves still run; the long sweep belongs on a developer's machine
      # where it costs nobody's minutes.
      - name: fuzz harnesses
        run: make fuzz CASES=20000

      # LAST, BECAUSE IT REMOVES WHAT THE STEPS ABOVE BUILT, and that is also
      # why it is worth running: `clean` checks its own work and refuses when
      # a build artifact is in no list it reads. Nothing ran it here, so it
      # went on being right about a tree it was no longer describing --
      # OBJS and TEST_OBJS were snapshots taken above the two file backends'
      # conditional blocks, so both backends' objects survived every clean.
      # Found in a consumer's tree while moving their submodule pin, which is
      # the one place `clean` gets run by somebody who did not write it.
      # ONCE PER BUILD DIRECTORY, because `clean` can only remove the one
      # it is told about. The sanitizer step above builds into a second
      # tree, and a default clean neither removes it nor could know to --
      # so it removed everything it knew and then refused, naming that
      # tree as something the build produces that is in no list clean
      # reads. The refusal is the target working: it found a step this
      # file had added and not finished.
      - name: clean removes what the build made
        run: |
          make clean BUILD_DIR=san
          make clean
